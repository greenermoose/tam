<h1>Redirection</h1>
<p>Redirection changes where command input or output goes.</p>
<section data-level="novice"><p>Use <code>&gt;</code> to send output to a file.</p></section>
<section data-level="learner"><p>Example: <code>echo hello &gt; out.txt</code>.</p></section>
